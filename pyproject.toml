[project]
name = "COCO"
version = "0.1.0"
description = "COCO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain-qwq>=0.2.0",
    "langgraph>=0.5.4",
    "numpy>=2.3.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["assets*", "examples*", "tests*"]
